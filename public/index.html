<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Nilou — Cliente</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 1rem; }
    input, button, select, textarea { width: 100%; padding: 0.6rem; margin: 0.4rem 0; box-sizing: border-box; }
    button { background: #111; color: white; border: none; cursor: pointer; }
    .hidden { display: none; }
    pre { background: #f4f4f4; padding: 1rem; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Nilou</h2>
  <div id="loginBox">
    <h3>Login</h3>
    <input id="loginEmail" placeholder="E-mail" />
    <input id="loginPass" type="password" placeholder="Senha" />
    <button onclick="doLogin()">Entrar</button>
    <p><a href="#" onclick="showRegister()">Criar conta</a></p>
  </div>
  <div id="registerBox" class="hidden">
    <h3>Criar conta</h3>
    <input id="regNick" placeholder="Nickname" />
    <input id="regEmail" placeholder="E-mail" />
    <input id="regPass" type="password" placeholder="Senha" />
    <p>Captcha: digite <b>nilou</b></p>
    <input id="captcha" placeholder="Captcha" />
    <button onclick="doRegister()">Registrar</button>
    <p><a href="#" onclick="showLogin()">Voltar</a></p>
  </div>
  <div id="verifyBox" class="hidden">
    <h3>Verificação</h3>
    <p>Código (mostrado uma vez): <b id="showCode"></b></p>
    <input id="verifyCode" placeholder="xxxx-xxxx" />
    <button onclick="doVerify()">Verificar</button>
  </div>
  <div id="dash" class="hidden">
    <h3>Olá, <span id="nick"></span></h3>
    <button onclick="showCreateKey()">Criar chave</button>
    <div id="keyResult" class="hidden"><p>Sua chave (copie agora):</p><pre id="newKey"></pre></div>
    <h4>Testar API</h4>
    <input id="testKey" placeholder="Sua chave" />
    <input id="testPass" placeholder="Senha da chave (opcional)" />
    <textarea id="testQ" rows="3" placeholder="Pergunta"></textarea>
    <button onclick="testApi()">Enviar</button>
    <pre id="testOut"></pre>
    <button onclick="logout()">Sair</button>
  </div>
  <script>
    let currentEmail = '';
    function showLogin() {
      document.getElementById('loginBox').classList.remove('hidden');
      document.getElementById('registerBox').classList.add('hidden');
      document.getElementById('verifyBox').classList.add('hidden');
      document.getElementById('dash').classList.add('hidden');
    }
    function showRegister() {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('registerBox').classList.remove('hidden');
    }
    async function doRegister() {
      const body = { nickname: document.getElementById('regNick').value, email: document.getElementById('regEmail').value, password: document.getElementById('regPass').value, captcha: document.getElementById('captcha').value };
      const res = await fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await res.json();
      if (data.error) return alert(data.error);
      currentEmail = data.email;
      document.getElementById('showCode').textContent = data.verifyCode;
      document.getElementById('registerBox').classList.add('hidden');
      document.getElementById('verifyBox').classList.remove('hidden');
    }
    async function doVerify() {
      const code = document.getElementById('verifyCode').value;
      const res = await fetch('/api/verify', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email: currentEmail, code }) });
      const data = await res.json();
      if (data.error) return alert(data.error);
      alert('Verificado! Faça login.');
      showLogin();
    }
    async function doLogin() {
      const body = { email: document.getElementById('loginEmail').value, password: document.getElementById('loginPass').value };
      const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await res.json();
      if (data.error) return alert(data.error);
      currentEmail = data.user.email;
      document.getElementById('nick').textContent = data.user.nickname;
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('dash').classList.remove('hidden');
    }
    function showCreateKey() {
      const name = prompt('Nome da chave:');
      if (!name) return;
      fetch('/api/create-key', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email: currentEmail, name }) })
        .then(r => r.json()).then(data => {
          if (data.error) return alert(data.error);
          document.getElementById('newKey').textContent = data.apiKey;
          document.getElementById('keyResult').classList.remove('hidden');
        });
    }
    async function testApi() {
      const body = { k: document.getElementById('testKey').value, p: document.getElementById('testPass').value, q: document.getElementById('testQ').value };
      const res = await fetch('/', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await res.json();
      document.getElementById('testOut').textContent = JSON.stringify(data, null, 2);
    }
    function logout() { location.reload(); }
  </script>
</body>
</html>
