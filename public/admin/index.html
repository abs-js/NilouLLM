<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Nilou Admin</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    .sidebar { width: 200px; background: #111; color: white; height: 100vh; position: fixed; padding: 1rem; }
    .sidebar a { color: #aaa; display: block; margin: 0.8rem 0; text-decoration: none; }
    .main { margin-left: 220px; padding: 1.5rem; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h3>Admin</h3>
    <a href="/admin/">Início</a>
    <a href="/admin/tables.html">Chaves</a>
    <a href="/">Cliente</a>
  </div>
  <div class="main">
    <h2>Área do Administrador</h2>
    <p>Login admin: email <b>adm</b> / senha <b>130116</b></p>
    <button onclick="loadKeys()">Carregar chaves</button>
    <div id="keys"></div>
  </div>
  <script>
    async function loadKeys() {
      const res = await fetch('/api/admin/keys');
      const data = await res.json();
      document.getElementById('keys').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
    }
  </script>
</body>
</html>
